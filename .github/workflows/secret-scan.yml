# Fails a push or pull request when a tracked file contains a secret or an environment file is tracked.
# Prints file, line and kind only, never the value (tools/check-secrets.mjs).
name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-secrets.mjs --all
